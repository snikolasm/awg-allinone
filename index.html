<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AmneziaWG Panel</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        button, .btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
        button:hover, .btn:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        .btn-orange { background: #ea580c; }
        .btn-orange:hover { background: #c2410c; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-right: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background: #f9f9f9; font-weight: 600; }
        .status-running { color: #16a34a; font-weight: bold; }
        .status-stopped { color: #dc2626; font-weight: bold; }
        .actions { display: flex; gap: 8px; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 12px; }
        .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .alert-info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    </style>
</head>
<body>
    <h1>AmneziaWG Panel</h1>

    <div class="card">
        <h2>Статус сервера</h2>
        <p>Интерфейс: <code>awg0</code> — <span id="srv-status">загрузка...</span></p>
        <p id="srv-details" style="font-size: 14px; color: #555;"></p>
        <button onclick="loadServerStatus()">Обновить</button>
    </div>

    <div class="card" id="audit-card" style="display: none;">
        <h2 style="color: #dc2626;">Аудит системы (Найдены расхождения)</h2>
        <div id="audit-content"></div>
        <button onclick="loadAudit()" style="margin-top: 10px;">Перепроверить</button>
    </div>

    <div class="card">
        <h2>Создать клиента</h2>
        <input id="client-name" placeholder="Имя клиента">
        <input id="client-days" type="number" placeholder="Дней" min="1" style="width:100px">
        <button onclick="createClient()">Создать</button>
        <div id="create-result" style="margin-top:12px"></div>
    </div>

    <div class="card">
        <h2>Клиенты</h2>
        <button onclick="loadClients(); loadAudit();">Обновить список</button>
        <table id="clients-table">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>IP</th>
                    <th>Трафик (RX/TX)</th>
                    <th>Истекает</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function fmtBytes(b) {
            if (!b) return "0 B";
            const u = ["B","KB","MB","GB","TB"];
            let i = 0;
            while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
            return b.toFixed(2) + " " + u[i];
        }

        async function loadServerStatus() {
            const r = await fetch("/api/server/status");
            const d = await r.json();
            const el = document.getElementById("srv-status");
            const details = document.getElementById("srv-details");
            
            if (d.status === "running") {
                el.textContent = "работает";
                el.className = "status-running";
                details.innerHTML = `IP: <b>${d.ip}</b> | Порт: <b>${d.port}</b> | Сеть: <b>${d.network}</b> | MTU: <b>${d.mtu}</b>`;
            } else {
                el.textContent = "остановлен / ошибка";
                el.className = "status-stopped";
                details.textContent = d.message || "";
            }
        }

        async function loadClients() {
            const r = await fetch("/api/clients");
            const list = await r.json();
            const tbody = document.querySelector("#clients-table tbody");
            tbody.innerHTML = list.map(c => `
                <tr>
                    <td><b>${c.name}</b></td>
                    <td>${c.ip}</td>
                    <td>
                        <span style="color:green">↓ ${fmtBytes(c.rx)}</span> / 
                        <span style="color:blue">↑ ${fmtBytes(c.tx)}</span>
                    </td>
                    <td>${c.expire_at.slice(0,10)}</td>
                    <td class="actions">
                        <a href="/api/clients/${c.name}/config" class="btn btn-green" download>Скачать .conf</a>
                        <a href="/api/clients/${c.name}/qr" target="_blank" class="btn btn-orange">QR-код</a>
                    </td>
                </tr>
            `).join("");
        }

        async function loadAudit() {
            const r = await fetch("/api/system/audit");
            const d = await r.json();
            const card = document.getElementById("audit-card");
            const content = document.getElementById("audit-content");
            
            let html = "";

            if (d.missing_in_kernel.length > 0) {
                html += `<div class="alert alert-warning"><b>Есть в базе, но отсутствуют в ядре:</b>
                <table><tr><th>Имя</th><th>IP</th><th>Действие</th></tr>`;
                d.missing_in_kernel.forEach(item => {
                    html += `<tr><td>${item.name}</td><td>${item.ip}</td>
                             <td><button class="btn btn-danger" onclick="cleanAudit('remove_broken', '${item.name}', '${item.pub_key}')">Удалить</button></td></tr>`;
                });
                html += `</table></div>`;
            }

            if (d.orphaned_in_kernel.length > 0) {
                html += `<div class="alert alert-info"><b>Фантомные пиры (есть в ядре, нет в базе):</b>
                <table><tr><th>Публичный ключ</th><th>Действие</th></tr>`;
                d.orphaned_in_kernel.forEach(item => {
                    html += `<tr><td><code>${item.pub_key}</code></td>
                             <td><button class="btn btn-danger" onclick="cleanAudit('remove_orphan', '', '${item.pub_key}')">Удалить</button></td></tr>`;
                });
                html += `</table></div>`;
            }

            if (d.missing_files.length > 0) {
                html += `<div class="alert alert-warning"><b>Отсутствуют файлы конфигурации на диске:</b> ${d.missing_files.join(', ')}.</div>`;
            }

            if (html === "") {
                card.style.display = "none";
            } else {
                card.style.display = "block";
                content.innerHTML = html;
            }
        }

        async function cleanAudit(action, name, pub_key) {
            if (!confirm("Вы уверены, что хотите удалить эту запись?")) return;
            
            const r = await fetch("/api/system/audit/clean", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({action, name, pub_key})
            });
            const d = await r.json();
            
            if (d.ok) {
                loadClients();
                loadAudit();
            } else {
                alert("Ошибка: " + d.message);
            }
        }

        async function createClient() {
            const name = document.getElementById("client-name").value.trim();
            const days = parseInt(document.getElementById("client-days").value);
            if (!name || !days) { alert("Введите имя и дни"); return; }
            
            const r = await fetch("/api/clients", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, days})
            });
            const d = await r.json();
            const div = document.getElementById("create-result");
            
            if (d.ok) {
                div.innerHTML = `<p style="color:green">Клиент <b>${name}</b> создан.</p>`;
                document.getElementById("client-name").value = "";
                document.getElementById("client-days").value = "";
                loadClients();
                loadAudit();
            } else {
                div.innerHTML = `<p style="color:red">Ошибка: ${d.message}</p>`;
            }
        }

        loadServerStatus();
        loadClients();
        loadAudit();
    </script>
</body>
</html>
