<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AmneziaWG Panel</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; margin-right: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .status-running { color: #16a34a; font-weight: bold; }
        .status-error { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AmneziaWG Panel</h1>

    <!-- Статус -->
    <div class="card">
        <h2>Статус сервера</h2>
        <p>Интерфейс: <code>awg0</code> — <span id="srv-status">загрузка...</span></p>
        <p id="srv-details"></p>
    </div>

    <!-- Создание сервера -->
    <div class="card" id="create-server-card">
        <h2>Создать сервер (awg0.conf)</h2>
        <p>Если файл сервера отсутствует, заполните данные:</p>
        <input id="srv-network" placeholder="Сеть (например, 10.9.9.0/24)" value="10.9.9.0/24">
        <input id="srv-port" placeholder="Порт" value="54443">
        <button onclick="createServer()">Сгенерировать и сохранить</button>
        <div id="server-result" style="margin-top:12px"></div>
    </div>

    <!-- Создание клиента -->
    <div class="card">
        <h2>Создать клиента</h2>
        <input id="client-name" placeholder="Имя клиента">
        <input id="client-days" type="number" placeholder="Дней" value="30">
        <button onclick="createClient()">Создать</button>
        <div id="create-result" style="margin-top:12px"></div>
    </div>

    <!-- Список клиентов -->
    <div class="card">
        <h2>Клиенты</h2>
        <button onclick="loadClients()">Обновить</button>
        <table id="clients-table">
            <thead><tr><th>Имя</th><th>IP</th><th>Истекает</th><th>Действия</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function createServer() {
            const network = document.getElementById("srv-network").value;
            const port = document.getElementById("srv-port").value;
            const r = await fetch("/api/server/generate", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({network, port})
            });
            const d = await r.json();
            document.getElementById("server-result").innerHTML = d.ok 
                ? `<p style="color:green">Сервер создан! Перезапустите контейнер.</p>` 
                : `<p style="color:red">Ошибка: ${d.message}</p>`;
            loadStatus();
        }

        async function loadStatus() {
            const r = await fetch("/api/server/status");
            const d = await r.json();
            const el = document.getElementById("srv-status");
            const details = document.getElementById("srv-details");
            if (d.status === "running") {
                el.textContent = "работает";
                el.className = "status-running";
                details.innerHTML = `IP: ${d.ip} | Порт: ${d.port} | Сеть: ${d.network}`;
                document.getElementById("create-server-card").style.display = "none";
            } else {
                el.textContent = "остановлен / ошибка";
                el.className = "status-error";
                details.textContent = d.message || "";
                document.getElementById("create-server-card").style.display = "block";
            }
        }

        async function loadClients() {
            const r = await fetch("/api/clients");
            const list = await r.json();
            document.querySelector("#clients-table tbody").innerHTML = list.map(c => `
                <tr>
                    <td>${c.name}</td>
                    <td>${c.ip}</td>
                    <td>${c.expire_at.slice(0,10)}</td>
                    <td>
                        <a href="/api/clients/${c.name}/config" download>Скачать .conf</a> | 
                        <a href="/api/clients/${c.name}/qr" target="_blank">QR</a>
                    </td>
                </tr>
            `).join("");
        }

        async function createClient() {
            const name = document.getElementById("client-name").value;
            const days = document.getElementById("client-days").value;
            const r = await fetch("/api/clients", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, days: parseInt(days)})
            });
            const d = await r.json();
            document.getElementById("create-result").innerHTML = d.ok 
                ? `<p style="color:green">Клиент создан</p>` 
                : `<p style="color:red">${d.message}</p>`;
            loadClients();
        }

        loadStatus();
        loadClients();
    </script>
</body>
</html>
