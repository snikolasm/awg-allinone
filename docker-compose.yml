version: '3.8'

services:
  awg-panel:
    build: .
    container_name: awg-allinone
    restart: unless-stopped
    networks:
      - lan-dhcp  # Используем новую сеть с DHCP
    
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs:/opt/awg-panel/configs
      - ./qr:/opt/awg-panel/qr
      - ./server-data:/etc/amnezia/amneziawg
    environment:
      - AWG_SERVER_IP=ВАШ_ВНЕШНИЙ_IP

networks:
  lan-dhcp:
    external: true
    name: lan-dhcp
