version: '3.8'

services:
  awg-panel:
    build: .
    container_name: awg-allinone
    restart: unless-stopped
    # Используем сеть хоста для доступа к интерфейсам и файрволу
    network_mode: host 
    #pid: host # Раскомментируйте, если хотите использовать nsenter для ufw
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs:/opt/awg-panel/configs
      - ./qr:/opt/awg-panel/qr
      - ./server-data:/etc/amnezia/amneziawg
      # Пробрасываем сокет Docker, если нужно управлять контейнерами
      # - /var/run/docker.sock:/var/run/docker.sock 
