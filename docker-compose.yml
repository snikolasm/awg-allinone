version: '3.8'

services:
  awg-panel:
    build: .
    container_name: awg-allinone
    restart: unless-stopped
    networks:
      - webgateway  # Оставляем эту сеть для обратного прокси
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    # Удалите sysctls, они конфликтуют с непривилегированным режимом
    volumes:
      - ./configs:/opt/awg-panel/configs
      - ./qr:/opt/awg-panel/qr
      - ./server-data:/etc/amnezia/amneziawg

networks:
  webgateway:
    external: true
