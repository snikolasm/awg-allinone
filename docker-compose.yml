version: '3.8'

services:
  awg-panel:
    build: .
    container_name: awg-allinone
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./configs:/opt/awg-panel/configs
      - ./qr:/opt/awg-panel/qr
      - ./server-data:/etc/amnezia/amneziawg
