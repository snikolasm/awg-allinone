version: '3.8'

services:
  awg-panel:
    build: .
    container_name: awg-allinone
    restart: unless-stopped
    
    # Убираем network_mode: host
    # network_mode: host
    
    networks:
      lan_macvlan:
        # Здесь можно задать статический IP для панели (опционально)
        # ipv4_address: 192.168.1.245 
    
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs:/opt/awg-panel/configs
      - ./qr:/opt/awg-panel/qr
      - ./server-data:/etc/amnezia/amneziawg
    environment:
      - AWG_SERVER_IP=ВАШ_ВНЕШНИЙ_IP

# Подключаем внешнюю сеть, которую создали в Portainer
networks:
  lan_macvlan:
    external: true
    name: lan_macvlan # Имя должно совпадать с тем, что вы создали
